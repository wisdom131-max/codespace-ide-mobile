name: VerifyError bytecode diagnostics (no application fix)
on:
  push:
    branches: [diagnostics/verifyerror-b032295]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: candidate-dde79d7
            source: dde79d7cae88dbe608d9ee63715055a40bcc80cc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Prepare completely clean build
        run: |
          sudo apt-get update && sudo apt-get install -y patchelf
          rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/daemon" android/.gradle android/app/build android/build
          chmod +x android/gradlew
          mkdir -p diagnostic-output
          git rev-parse HEAD > diagnostic-output/source-sha.txt
      - name: Compile unchanged source from scratch
        working-directory: android
        run: ./gradlew --no-daemon --no-build-cache --rerun-tasks clean assembleProdDebug --stacktrace
      - name: Preserve JVM inputs, dex outputs and compiler version
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, hashlib
          out=Path('diagnostic-output');out.mkdir(exist_ok=True)
          matches=list(Path('android/app/build').rglob('ProjectShellScreenKt.class'))
          rows=[]
          for index,p in enumerate(matches):
              dst=out/('PSS-input-'+str(index)+'.class');shutil.copy2(p,dst)
              rows.append(str(p)+' SHA256 '+hashlib.sha256(p.read_bytes()).hexdigest()+' saved '+dst.name)
          (out/'class-input-locations.txt').write_text('\n'.join(rows))
          print('\n'.join(rows))
          for p in Path('android/app/build/outputs/apk').rglob('*x86_64-debug.apk'):
              shutil.copy2(p,out/'unchanged-source-x86_64.apk')
          for p in Path.home().joinpath('.gradle/caches/modules-2/files-2.1/com.android.tools/r8').rglob('*.jar'):
              shutil.copy2(p,out/'r8.jar');(out/'r8-origin.txt').write_text(str(p));print('D8 implementation',p)
              break
          PY
          for f in diagnostic-output/PSS-input-*.class; do
            [ -f "$f" ] || continue
            javap -c -l -v "$f" > "${f%.class}.javap.txt"
          done
          if [ -f diagnostic-output/r8.jar ]; then
            java -cp diagnostic-output/r8.jar com.android.tools.r8.D8 --version | tee diagnostic-output/d8-version.txt
          fi
      - name: Check JVM primitive/reference categories without application stubs
        if: always()
        run: |
          mkdir -p /tmp/asm-check
          for a in asm asm-tree asm-analysis; do
            curl -fsSL "https://repo.maven.apache.org/maven2/org/ow2/asm/$a/9.6/$a-9.6.jar" -o "/tmp/asm-check/$a.jar"
          done
          cat > /tmp/asm-check/Check.java <<'JAVA'
          import java.nio.file.*;
          import org.objectweb.asm.*;
          import org.objectweb.asm.tree.*;
          import org.objectweb.asm.tree.analysis.*;
          public class Check {
            public static void main(String[] args) throws Exception {
              for (String path: args) {
                ClassNode cls = new ClassNode();
                new ClassReader(Files.readAllBytes(Path.of(path))).accept(cls,0);
                System.out.println("CLASS INPUT " + path);
                for (MethodNode method: cls.methods) {
                  try {
                    new Analyzer<BasicValue>(new BasicVerifier()).analyze(cls.name,method);
                    if (method.name.equals("ProjectShellScreen")) {
                      System.out.println("JVM CATEGORY CHECK PASS " + method.name + method.desc + " locals=" + method.maxLocals + " instructions=" + method.instructions.size());
                    }
                  } catch (AnalyzerException e) {
                    System.out.println("JVM CATEGORY CHECK FAIL " + method.name + method.desc + " " + e.toString());
                    throw e;
                  }
                }
              }
            }
          }
          JAVA
          javac -cp '/tmp/asm-check/*' /tmp/asm-check/Check.java
          java -cp '/tmp/asm-check/*:/tmp/asm-check' Check diagnostic-output/PSS-input-*.class 2>&1 | tee diagnostic-output/jvm-category-check.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifyerror-${{ matrix.label }}
          path: diagnostic-output/
          if-no-files-found: error
          retention-days: 7
  art_verify:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: verifyerror-candidate-dde79d7
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: verifyerror-failing-b032295
          path: bad-control
          run-id: 36854430784
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: verifyerror-before-render-87d1f80
          path: good-control
          run-id: 36855011832
          github-token: ${{ github.token }}
      - name: Build Android runtime verifier probe
        run: |
          mkdir -p probe/classes probe/dex
          cat > probe/VerifyPss.java <<'JAVA'
          public final class VerifyPss {
            public static void main(String[] args) {
              boolean shouldReject = args[0].equals("reject");
              try {
                Class<?> cls = Class.forName("com.codespace.ide.ui.screens.ProjectShellScreenKt", true, VerifyPss.class.getClassLoader());
                int count = cls.getDeclaredMethods().length;
                if (shouldReject) {
                  System.err.println("CONTROL FAILURE: known-bad class was not rejected");
                  System.exit(2);
                }
                System.out.println("ART_PSS_ACCEPTED methods=" + count);
              } catch (VerifyError e) {
                String text = e.toString();
                e.printStackTrace();
                if (shouldReject && text.contains("ProjectShellScreen") && text.contains("copy-cat1")) {
                  System.out.println("ART_EXPECTED_PSS_VERIFYERROR_REPRODUCED");
                } else {
                  System.err.println("ART_UNEXPECTED_VERIFYERROR");
                  System.exit(3);
                }
              } catch (Throwable e) {
                e.printStackTrace();
                System.err.println("ART_PROBE_DEPENDENCY_OR_INITIALIZATION_FAILURE");
                System.exit(4);
              }
            }
          }
          JAVA
          javac --release 8 -d probe/classes probe/VerifyPss.java
          curl -fsSL https://storage.googleapis.com/r8-releases/raw/8.5.10/r8.jar -o probe/r8.jar
          java -cp probe/r8.jar com.android.tools.r8.D8 --min-api 26 --output probe/dex probe/classes/VerifyPss.class
      - name: Verify original, baseline and candidate with Android 14 ART
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p art-results
            adb shell getprop ro.build.fingerprint > art-results/emulator-fingerprint.txt
            adb push probe/dex/classes.dex /data/local/tmp/verify-pss.dex
            adb push bad-control/unchanged-source-x86_64.apk /data/local/tmp/bad-pss.apk
            adb push good-control/unchanged-source-x86_64.apk /data/local/tmp/good-pss.apk
            adb push candidate/unchanged-source-x86_64.apk /data/local/tmp/candidate-pss.apk
            adb shell dalvikvm -Xverify:all -cp /data/local/tmp/verify-pss.dex:/data/local/tmp/bad-pss.apk VerifyPss reject > art-results/bad-control.txt 2>&1
            grep ART_EXPECTED_PSS_VERIFYERROR_REPRODUCED art-results/bad-control.txt
            adb shell dalvikvm -Xverify:all -cp /data/local/tmp/verify-pss.dex:/data/local/tmp/good-pss.apk VerifyPss accept > art-results/good-control.txt 2>&1
            grep ART_PSS_ACCEPTED art-results/good-control.txt
            adb shell dalvikvm -Xverify:all -cp /data/local/tmp/verify-pss.dex:/data/local/tmp/candidate-pss.apk VerifyPss accept > art-results/candidate.txt 2>&1
            grep ART_PSS_ACCEPTED art-results/candidate.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-verifier-controls-and-candidate
          path: art-results/
          if-no-files-found: warn
          retention-days: 7
