name: Backend keep-alive

# Prevents Supabase free-tier auto-pause (~7 days inactivity) by running a
# REAL database query directly against Postgres — not just a Render HTTP ping,
# which never reaches the database. Also curls Render health for a warmth log.
# Requires repo secret DATABASE_URL (the same postgres:// URL Render uses).

on:
  schedule:
    # Daily at 06:00 UTC — comfortable margin vs. the 7-day pause window.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The probe lives in scripts/, so the job needs the repo. Without this the step ran a path that
      # did not exist and reported "No such file or directory" as a backend failure - a probe failing
      # for a reason that has nothing to do with the backend, which is the confusion this job exists
      # to avoid.
      - uses: actions/checkout@v4
      - name: Ping Supabase Postgres with a real query
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "[$(date -u)] Running keep-alive SELECT 1 against Supabase..."
          psql "$DATABASE_URL" -c 'SELECT 1 AS alive;'
          echo "[$(date -u)] Supabase keep-alive query succeeded — activity clock reset."

      - name: Ping Render backend health (warmth log)
        # Retries a Render free-tier cold start instead of calling it an outage, and treats any
        # non-2xx as a FAILURE. See scripts/backend-health-probe.sh for why both rules exist.
        env:
          PROBE_URL: https://codespace-ide-backend.onrender.com/api/v1/health
          PROBE_ATTEMPTS: "3"
          PROBE_TIMEOUT: "120"
        run: bash scripts/backend-health-probe.sh

      - name: Probe behaviour regression check
        run: bash scripts/test-backend-health-probe.sh
