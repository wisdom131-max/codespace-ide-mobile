name: Build Static Proot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

jobs:
  build-proot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            ndk_arch: aarch64
          - abi: armeabi-v7a
            target: armv7a-linux-androideabi
            ndk_arch: arm
          - abi: x86_64
            target: x86_64-linux-android
            ndk_arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install build deps
        run: sudo apt-get install -y autoconf automake libtool pkg-config python3

      - name: Clone Termux proot source
        run: |
          git clone --depth=1 https://github.com/termux/proot.git /tmp/proot-src
          cd /tmp/proot-src
          git submodule update --init --recursive

      - name: Build talloc
        run: |
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/${{ matrix.target }}21-clang
          export AR=$TOOLCHAIN/bin/llvm-ar
          # Write minimal talloc stub - proot only needs memory allocation
          cat > /tmp/talloc_stub.c << 'EOF'
          #include <stdlib.h>
          #include <string.h>
          void *talloc_named_const(const void *ctx, size_t size, const char *name) { return malloc(size); }
          void *_talloc_zero(const void *ctx, size_t size, const char *name) { return calloc(1, size); }
          void *talloc_steal_fn(const void *ctx, const void *ptr) { return (void*)ptr; }
          int talloc_free(void *ptr) { free(ptr); return 0; }
          void *talloc_parent(const void *ptr) { return NULL; }
          size_t talloc_get_size(const void *ptr) { return 0; }
          void *talloc_realloc_fn(const void *ctx, void *ptr, size_t size) { return realloc(ptr, size); }
          char *talloc_strdup(const void *ctx, const char *str) { return str ? strdup(str) : NULL; }
          char *talloc_asprintf(const void *ctx, const char *fmt, ...) { return NULL; }
          void talloc_set_destructor(const void *ptr, void *destructor) {}
          void talloc_report_full(const void *ptr, void *f) {}
          void *talloc_new(const void *ctx) { return malloc(1); }
          EOF
          $CC -c /tmp/talloc_stub.c -o /tmp/talloc.o
          $AR rcs /tmp/libtalloc.a /tmp/talloc.o
          # Create talloc.h for proot to include
          cat > /tmp/talloc.h << 'HEOF'
          #pragma once
          #include <stdlib.h>
          #include <string.h>
          #define talloc(ctx, type) ((type*)malloc(sizeof(type)))
          #define talloc_zero(ctx, type) ((type*)calloc(1, sizeof(type)))
          #define talloc_array(ctx, type, n) ((type*)malloc(sizeof(type)*(n)))
          #define talloc_zero_array(ctx, type, n) ((type*)calloc(n, sizeof(type)))
          #define talloc_size(ctx, size) malloc(size)
          #define talloc_free(ptr) (free(ptr), 0)
          #define talloc_steal(ctx, ptr) (ptr)
          #define talloc_get_size(ptr) (0)
          #define talloc_strdup(ctx, str) ((str) ? strdup(str) : NULL)
          #define talloc_asprintf(ctx, ...) NULL
          #define talloc_set_destructor(ptr, fn)
          #define talloc_new(ctx) malloc(1)
          #define TALLOC_CTX void
          void *talloc_named_const(const void *ctx, size_t size, const char *name);
          void *_talloc_zero(const void *ctx, size_t size, const char *name);
          int talloc_free(void *ptr);
          char *talloc_strdup(const void *ctx, const char *str);
          HEOF
          mkdir -p /tmp/proot-src/src
          cp /tmp/talloc.h /tmp/proot-src/src/talloc.h

      - name: Build static proot
        run: |
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/${{ matrix.target }}21-clang
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          cd /tmp/proot-src
          make -C src proot \
            CC="$CC" AR="$AR" RANLIB="$RANLIB" \
            LDFLAGS="-static" \
            TALLOC_CFLAGS="-I/tmp/talloc-src" \
            TALLOC_LIBS="/tmp/talloc-src/libtalloc.a"

      - name: Copy binary to jniLibs
        run: |
          BINARY=$(find /tmp/proot-src -name "proot" -type f | head -1)
          if [ -z "$BINARY" ]; then echo "BUILD FAILED"; exit 1; fi
          cp "$BINARY" android/app/src/main/jniLibs/${{ matrix.abi }}/libproot.so
          file android/app/src/main/jniLibs/${{ matrix.abi }}/libproot.so

      - name: Commit binary
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add android/app/src/main/jniLibs/${{ matrix.abi }}/libproot.so
          git diff --cached --quiet || git commit -m "ci: update static proot for ${{ matrix.abi }}"
          git push
