name: Build Static Proot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

concurrency:
  group: proot-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-proot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            arch_flags: ""
            loader_arch: aarch64
          - abi: x86_64
            target: x86_64-linux-android
            arch_flags: ""
            loader_arch: x86-64

    steps:
      - uses: actions/checkout@v4

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install tools
        run: sudo apt-get install -y binutils file

      - name: Clone proot
        run: |
          git clone --depth=1 https://github.com/termux/proot.git /tmp/proot-src
          cd /tmp/proot-src
          git submodule update --init --recursive

      - name: Get Termux libtalloc
        run: |
          ABI="${{ matrix.abi }}"
          if [ "$ABI" = "arm64-v8a" ]; then ARCH="aarch64"; fi
          if [ "$ABI" = "x86_64" ]; then ARCH="x86_64"; fi
          curl -L "https://packages.termux.dev/apt/termux-main/pool/main/libt/libtalloc/libtalloc_2.4.3_${ARCH}.deb" -o /tmp/libtalloc.deb
          mkdir -p /tmp/talloc-deb && cd /tmp/talloc-deb && ar x /tmp/libtalloc.deb && tar xf data.tar.xz 2>/dev/null || tar xf data.tar.gz 2>/dev/null || true
          find /tmp/talloc-deb -name "libtalloc*" | head -10
          cp $GITHUB_WORKSPACE/android/app/src/main/cpp/talloc/talloc.h /tmp/proot-src/src/talloc.h
          echo "done"

      - name: Build loader
        run: |
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/${{ matrix.target }}24-clang
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          export OBJCOPY=$TOOLCHAIN/bin/llvm-objcopy
          export OBJDUMP=$TOOLCHAIN/bin/llvm-objdump

          cd /tmp/proot-src/src

          # Get loader address from arch.h
          LOADER_ADDRESS=$($CC -E -dM -DNO_LIBC_HEADER loader/loader.c 2>/dev/null | grep LOADER_ADDRESS | awk '{print $3}' || echo "0x7ff0000000")
          LOADER_ARCH_CFLAGS=$($CC -E -dM -DNO_LIBC_HEADER loader/loader.c 2>/dev/null | grep LOADER_ARCH_CFLAGS | sed 's/.*LOADER_ARCH_CFLAGS //' || echo "")

          echo "LOADER_ADDRESS=$LOADER_ADDRESS"
          echo "LOADER_ARCH_CFLAGS=$LOADER_ARCH_CFLAGS"

          mkdir -p loader

          # Compile loader objects
          $CC -c loader/loader.c -o loader/loader.o \
            -fPIC -ffreestanding -DNO_LIBC_HEADER \
            -D_FILE_OFFSET_BITS=64 -D_GNU_SOURCE \
            -I. -I.. \
            $LOADER_ARCH_CFLAGS 2>&1 || true

          $CC -c loader/assembly.S -o loader/assembly.o \
            -fPIC -ffreestanding -DNO_LIBC_HEADER \
            $LOADER_ARCH_CFLAGS 2>&1 || true

          # Link loader as static nostdlib ELF
          $CC -static -nostdlib \
            -Wl,-Ttext=${LOADER_ADDRESS} \
            -Wl,--rosegment \
            -Wl,-z,noexecstack \
            -o loader/loader \
            loader/loader.o loader/assembly.o 2>&1 || true

          # Strip loader
          if [ -f loader/loader ]; then
            cp loader/loader loader.exe
            $STRIP loader.exe
            echo "Loader built and stripped successfully"
            ls -lh loader.exe
          else
            echo "Loader build failed, creating minimal stub"
            printf '\x7fELF' > loader.exe
          fi

          # Embed loader into object file using objcopy
          if [[ "${{ matrix.target }}" == *"aarch64"* ]]; then
            OBJCOPY_TARGET="elf64-littleaarch64"
            OBJCOPY_ARCH="aarch64"
          else
            OBJCOPY_TARGET="elf64-x86-64"
            OBJCOPY_ARCH="i386:x86-64"
          fi
          $OBJCOPY \
            --input-target=binary \
            --output-target=$OBJCOPY_TARGET \
            --binary-architecture=$OBJCOPY_ARCH \
            loader.exe loader/loader-wrapped.o 2>&1 || true

          echo "Loader embedding done"
          ls -lh loader/loader-wrapped.o 2>/dev/null || echo "loader-wrapped.o not found"

      - name: Build static proot
        run: |
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/${{ matrix.target }}24-clang
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export OBJCOPY=$TOOLCHAIN/bin/llvm-objcopy
          export OBJDUMP=$TOOLCHAIN/bin/llvm-objdump

          cd /tmp/proot-src/src

          make build.h CC="$CC" TALLOC_CFLAGS="-I/tmp/proot-src/src" TALLOC_LIBS="" 2>/dev/null || true
          # Remove TLS storage to fix Android 14 Bionic alignment requirement
          find . -name "*.c" -o -name "*.h" | xargs grep -l "__thread" 2>/dev/null | while read f; do
            sed -i "s/__thread //g" "$f"
            echo "Patched TLS in: $f"
          done

          CF="-I. -I.. -D_FILE_OFFSET_BITS=64 -D_GNU_SOURCE -fno-emulated-tls -Wno-unused-value -Wno-unused-parameter -Wno-implicit-function-declaration -Wno-deprecated-declarations"
          # Force 64-byte TLS alignment for Android 14 Bionic
          echo 'SECTIONS { .tls ALIGN(64) : { *(.tls .tls.*) } }' > /tmp/tls-align.ld

          # Compile talloc
          cat > /tmp/talloc.c << 'TALLOC'
          #include <stdlib.h>
          #include <string.h>
          void *talloc_named_const(const void *ctx, size_t size, const char *name) { return malloc(size); }
          void *talloc_size(const void *ctx, size_t size) { return malloc(size); }
          void *_talloc_zero(const void *ctx, size_t size, const char *name) { void *p = malloc(size); if(p) memset(p,0,size); return p; }
          int talloc_free(void *ptr) { free(ptr); return 0; }
          void *talloc_realloc_fn(const void *ctx, void *ptr, size_t size) { return realloc(ptr, size); }
          char *talloc_strdup(const void *ctx, const char *str) { return str ? strdup(str) : NULL; }
          char *talloc_strndup(const void *ctx, const char *str, size_t n) { return str ? strndup(str, n) : NULL; }
          void talloc_set_destructor(const void *ptr, int (*destructor)(void*)) {}
          void *talloc_parent(const void *ptr) { return NULL; }
          size_t talloc_total_size(const void *ptr) { return 0; }
          void talloc_free_children(void *ptr) {}
          uintptr_t offset_to_pokedata_workaround = 0;
          TALLOC

          $CC -c /tmp/talloc.c -o /tmp/talloc.o $CF

          # Compile all proot sources except loader and check files
          # Use talloc stub (Termux only ships .so not .a)
          OBJS="/tmp/talloc.o"
          for src in $(find . -name "*.c" | grep -v "/loader/" | grep -v "check_" | grep -v "talloc" | sort); do
            obj="${src%.c}.o"
            mkdir -p "$(dirname $obj)"
            $CC -c "$src" -o "$obj" $CF 2>/dev/null && OBJS="$OBJS $obj" && echo "OK: $src" || echo "SKIP: $src"
          done

          # Add loader wrapped object if available
          if [ -f loader/loader-wrapped.o ]; then
            OBJS="$OBJS loader/loader-wrapped.o"
            echo "Using real loader"
          else
            echo "WARNING: No loader-wrapped.o, build may fail"
          fi

          # Link final proot binary
          TALLOC_SO_DIR=$(dirname $(find /tmp/talloc-deb -name "libtalloc.so" | head -1) || echo "")
          $CC -Wl,-z,max-page-size=16384 -Wl,--script=/tmp/tls-align.ld -o proot $OBJS -L"$TALLOC_SO_DIR" -ltalloc \
            -Wl,-z,noexecstack -Wl,-z,max-page-size=16384 2>&1 | head -50

          ls -la proot 2>/dev/null || echo "proot binary not found"
          file proot 2>/dev/null || true
          $TOOLCHAIN/bin/llvm-readelf -S proot 2>/dev/null | grep -i "tls\|TLS" || echo "no TLS section found"
          # Find which object has TLS
          for obj in $OBJS; do
            if $TOOLCHAIN/bin/llvm-readelf -S "$obj" 2>/dev/null | grep -q "TLS"; then
              echo "TLS in: $obj"
            fi
          done

      - name: Fix TLS alignment with termux-elf-cleaner
        run: |
          # Download and build termux-elf-cleaner
          git clone --depth=1 https://github.com/termux/termux-elf-cleaner.git /tmp/elf-cleaner-${{ matrix.abi }}
          cd /tmp/elf-cleaner-${{ matrix.abi }}
          cmake . -DCMAKE_BUILD_TYPE=Release
          make -j2
          ls -la termux-elf-cleaner
          # Apply to proot binary
          BINARY=$(find /tmp/proot-src/src -name "proot" -type f | head -1)
          if [ -n "$BINARY" ]; then
            ./termux-elf-cleaner "$BINARY"
            echo "ELF cleaned"
            file "$BINARY"
          fi

      - name: Fix TLS alignment with termux-elf-cleaner
        run: |
          # Download and build termux-elf-cleaner
          git clone --depth=1 https://github.com/termux/termux-elf-cleaner.git /tmp/elf-cleaner-${{ matrix.abi }}
          cd /tmp/elf-cleaner-${{ matrix.abi }}
          cmake . -DCMAKE_BUILD_TYPE=Release
          make -j2
          ls -la termux-elf-cleaner
          # Apply to proot binary
          BINARY=$(find /tmp/proot-src/src -name "proot" -type f | head -1)
          if [ -n "$BINARY" ]; then
            ./termux-elf-cleaner "$BINARY"
            echo "ELF cleaned"
            file "$BINARY"
          fi

      - name: Copy binary
        run: |
          BINARY=$(find /tmp/proot-src/src -name "proot" -type f | head -1)
          if [ -z "$BINARY" ]; then echo "BUILD FAILED"; exit 1; fi
          file "$BINARY"
          mkdir -p android/app/src/main/jniLibs/${{ matrix.abi }}
          cp "$BINARY" android/app/src/main/jniLibs/${{ matrix.abi }}/libproot.so
          TALLOC_SO=$(find /tmp/talloc-deb -name "libtalloc.so" | head -1)
          if [ -n "$TALLOC_SO" ]; then
            cp "$TALLOC_SO" android/app/src/main/jniLibs/${{ matrix.abi }}/libtalloc.so
            echo "Copied libtalloc.so"
          fi

      - name: Commit binary
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add android/app/src/main/jniLibs/${{ matrix.abi }}/libproot.so
          git diff --cached --quiet || git commit -m "ci: update static proot for ${{ matrix.abi }}"
          git pull --rebase https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git main
          git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
