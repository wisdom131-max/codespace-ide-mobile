name: Build Static Proot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write

jobs:
  build-proot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            arch: aarch64
            target: aarch64-linux-musl
          - abi: armeabi-v7a
            arch: arm
            target: armv7l-linux-musleabihf
          - abi: x86_64
            arch: x86_64
            target: x86_64-linux-musl

    steps:
      - uses: actions/checkout@v4

      - name: Install musl cross compiler
        run: |
          sudo apt-get install -y musl-tools wget
          wget -q https://musl.cc/${{ matrix.target }}-cross.tgz -O /tmp/musl.tgz
          tar xzf /tmp/musl.tgz -C /tmp/

      - name: Build talloc static
        run: |
          export CC=/tmp/${{ matrix.target }}-cross/bin/${{ matrix.target }}-gcc
          export AR=/tmp/${{ matrix.target }}-cross/bin/${{ matrix.target }}-ar
          curl -L "https://www.samba.org/ftp/talloc/talloc-2.4.1.tar.gz" -o /tmp/talloc.tar.gz
          mkdir -p /tmp/talloc-build
          tar xzf /tmp/talloc.tar.gz -C /tmp/talloc-build --strip-components=1
          cd /tmp/talloc-build
          ./configure --cross-compile --cross-answers=/dev/null CC="$CC" AR="$AR" --disable-python 2>/dev/null || true
          $CC -c talloc.c -DHAVE_LIBREPLACE=0 -include stdint.h -o /tmp/talloc.o 2>/dev/null ||           $CC -c talloc.c -o /tmp/talloc.o || true
          $AR rcs /tmp/libtalloc.a /tmp/talloc.o

      - name: Build static proot
        run: |
          export CC=/tmp/${{ matrix.target }}-cross/bin/${{ matrix.target }}-gcc
          export AR=/tmp/${{ matrix.target }}-cross/bin/${{ matrix.target }}-ar
          export RANLIB=/tmp/${{ matrix.target }}-cross/bin/${{ matrix.target }}-ranlib
          git clone --depth=1 https://github.com/termux/proot.git /tmp/proot-src
          cd /tmp/proot-src
          git submodule update --init --recursive
          make -C src proot \
            CC="$CC" AR="$AR" RANLIB="$RANLIB" \
            LDFLAGS="-static" \
            TALLOC_CFLAGS="-I/tmp/talloc-build" \
            TALLOC_LIBS="/tmp/libtalloc.a"
          find /tmp/proot-src -name "proot" -type f | head -3

      - name: Copy binary
        run: |
          BINARY=$(find /tmp/proot-src/src -name "proot" -type f | head -1)
          if [ -z "$BINARY" ]; then echo "BUILD FAILED"; exit 1; fi
          file "$BINARY"
          mkdir -p android/app/src/main/jniLibs/${{ matrix.abi }}
          cp "$BINARY" android/app/src/main/jniLibs/${{ matrix.abi }}/libproot.so

      - name: Commit binary
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add android/app/src/main/jniLibs/${{ matrix.abi }}/libproot.so
          git diff --cached --quiet || git commit -m "ci: update static proot for ${{ matrix.abi }}"
          git pull --rebase https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git main
          git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
