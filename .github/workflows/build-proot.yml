name: Build Static Proot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write

jobs:
  build-proot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: x86_64
            target: x86_64-linux-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Clone proot
        run: |
          git clone --depth=1 https://github.com/termux/proot.git /tmp/proot-src
          cd /tmp/proot-src
          git submodule update --init --recursive

      - name: Copy talloc implementation
        run: |
          cp android/app/src/main/cpp/talloc/talloc.h /tmp/proot-src/src/talloc.h
          echo talloc.h copied

      - name: Build static proot
        run: |
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/${{ matrix.target }}24-clang
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          cd /tmp/proot-src/src
          make build.h CC="$CC" TALLOC_CFLAGS="-I/tmp/proot-src/src" TALLOC_LIBS="" 2>/dev/null || true
          CF="-I. -D_FILE_OFFSET_BITS=64 -D_GNU_SOURCE -Wno-unused-value -Wno-unused-parameter -Wno-implicit-function-declaration -Wno-deprecated-declarations"
          OBJS=""
          for src in $(find . -name "*.c" | grep -v "/loader" | grep -v "check_" | sort); do
            obj="${src%.c}.o"
            $CC -c "$src" -o "$obj" $CF 2>/dev/null && OBJS="$OBJS $obj"
          done
          $CC -static -o proot $OBJS 2>&1 | head -30
          ls -la proot 2>/dev/null || echo "proot binary not found"

      - name: Copy binary
        run: |
          BINARY=$(find /tmp/proot-src/src -name "proot" -type f | head -1)
          if [ -z "$BINARY" ]; then echo "BUILD FAILED"; exit 1; fi
          file "$BINARY"
          mkdir -p android/app/src/main/jniLibs/${{ matrix.abi }}
          cp "$BINARY" android/app/src/main/jniLibs/${{ matrix.abi }}/libproot.so

      - name: Commit binary
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add android/app/src/main/jniLibs/${{ matrix.abi }}/libproot.so
          git diff --cached --quiet || git commit -m "ci: update static proot for ${{ matrix.abi }}"
          git pull --rebase https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git main
          git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
