name: Build Static Proot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

jobs:
  build-proot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            arch: aarch64
          - abi: armeabi-v7a
            arch: arm
          - abi: x86_64
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install patchelf
        run: sudo apt-get install -y patchelf

      - name: Download and extract Termux proot
        run: |
          curl -L "https://packages.termux.dev/apt/termux-main/pool/main/p/proot/proot_5.1.107.80_${{ matrix.arch }}.deb" -o /tmp/proot.deb
          cd /tmp
          ar x proot.deb || true
          tar xf data.tar.xz 2>/dev/null || tar xf data.tar.gz 2>/dev/null || true
          find /tmp -name "proot" -type f | head -5

      - name: Patch and copy proot
        run: |
          BINARY=$(find /tmp/data -name "proot" -type f | head -1)
          if [ -z "$BINARY" ]; then echo "proot not found"; exit 1; fi
          file "$BINARY"
          patchelf --set-interpreter /system/bin/linker64 "$BINARY" 2>/dev/null || true
          patchelf --remove-rpath "$BINARY" 2>/dev/null || true
          cp "$BINARY" android/app/src/main/jniLibs/${{ matrix.abi }}/libproot.so
          file android/app/src/main/jniLibs/${{ matrix.abi }}/libproot.so

      - name: Commit binary
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add android/app/src/main/jniLibs/${{ matrix.abi }}/libproot.so
          git diff --cached --quiet || git commit -m "ci: update proot for ${{ matrix.abi }}"
          git push
