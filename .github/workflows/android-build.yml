name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Print debug keystore SHA fingerprints
        working-directory: android
        run: |
          ./gradlew signingReport > /tmp/signing.txt 2>&1 || true
          echo "=== SIGNING REPORT ==="
          cat /tmp/signing.txt

      - name: Build APK (always signed with committed debug.keystore)
        # We always use the committed android/app/debug.keystore so every CI build
        # carries the SAME signature. This lets Android accept the new APK as a direct
        # upgrade (install -r / "Install anyway") without requiring an uninstall.
        # versionCode auto-increments via git rev-list --count HEAD (see build.gradle.kts)
        # so Android always sees it as a newer version.
        working-directory: android
        run: ./gradlew assembleProdDebug --stacktrace --no-build-cache

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: codespace-ide-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
