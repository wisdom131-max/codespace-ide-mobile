name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # CI-FIX 2026-09-15: Google removed the legacy 'tools' SDK package, which
        # broke every build from #2812 up (sdkmanager exit 1 in setup, before any
        # Kotlin compiled). v4 + explicit packages skips the dead 'tools' package.
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Print debug keystore SHA fingerprints
        working-directory: android
        run: |
          ./gradlew signingReport > /tmp/signing.txt 2>&1 || true
          echo "=== SIGNING REPORT ==="
          cat /tmp/signing.txt

      - name: Build APK (always signed with committed debug.keystore)
        # We always use the committed android/app/debug.keystore so every CI build
        # carries the SAME signature. This lets Android accept the new APK as a direct
        # upgrade (install -r / "Install anyway") without requiring an uninstall.
        # versionCode auto-increments via git rev-list --count HEAD (see build.gradle.kts)
        # so Android always sees it as a newer version.
        working-directory: android
        run: ./gradlew assembleProdDebug --stacktrace --no-build-cache

      - name: Verify pinned pdfbox-android checksum
        # C12 Stage 3 U4: the pdfbox-android dependency is PINNED. Gradle
        # resolved the exact AAR during the build above; this step re-verifies
        # its SHA-256 against the pinned value from Maven Central and FAILS the
        # build if the artifact bytes ever change (supply-chain guard; same
        # posture as the pinned Ubuntu rootfs asset).
        run: |
          AAR=$(find ~/.gradle/caches -name "pdfbox-android-2.0.27.0.aar" | head -n 1)
          if [ -z "$AAR" ]; then
            echo "FATAL: pdfbox-android-2.0.27.0.aar not found in the Gradle cache"; exit 1
          fi
          echo "resolved: $AAR"
          ACTUAL=$(sha256sum "$AAR" | cut -d' ' -f1)
          EXPECTED=30277f879cfd571db2a137582c95516a0d4ea6778e945519bc58ca93d57d88c7
          echo "actual:   $ACTUAL"
          echo "expected:  $EXPECTED"
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "CHECKSUM MISMATCH — refusing to build"; exit 1; }

      # ADVISOR 2026-10-13 (item 1): REAL-ASSET fixtures. The pinned Ubuntu
      # arm64 asset that "Download fresh" installs — fetched, size+SHA-256
      # verified, extracted and cached — replaces hand-made fixtures that
      # encoded an x86 lib64 assumption the gate then rejected every healthy
      # arm64 restore with ("missing lib64"). Tests skip (assumeTrue) when the
      # variable is absent, so local JVM runs stay green and honest.
      - name: Cache pinned Ubuntu rootfs for real-asset tests
        uses: actions/cache@v4
        with:
          path: ~/questing-rootfs
          key: questing-aarch64-57831960-5ab35b90cd9a9f180656261ba400a135c4c01c2da4b74522118342f985c2d328

      - name: Fetch + verify + extract pinned Ubuntu asset
        run: |
          mkdir -p "$HOME/questing-rootfs"
          cd "$HOME/questing-rootfs"
          if [ ! -f ubuntu.tar.xz ]; then
            curl -sL -o ubuntu.tar.xz https://github.com/termux/proot-distro/releases/download/v4.30.1/ubuntu-questing-aarch64-pd-v4.30.1.tar.xz
          fi
          SIZE=$(stat -c%s ubuntu.tar.xz)
          if [ "$SIZE" != "57831960" ]; then echo "SIZE MISMATCH: $SIZE"; rm -f ubuntu.tar.xz; exit 1; fi
          echo "5ab35b90cd9a9f180656261ba400a135c4c01c2da4b74522118342f985c2d328  ubuntu.tar.xz" | sha256sum -c -
          # Device nodes under /dev/ need mknod (root); the unprivileged runner
          # cannot create them and the app's own extractor skips special files
          # anyway — exclude them so the extraction succeeds for the JVM tests.
          if [ ! -d ubuntu-questing-aarch64 ]; then tar -xJf ubuntu.tar.xz --exclude='ubuntu-questing-aarch64/dev/*'; fi
          test -f ubuntu-questing-aarch64/usr/bin/bash
          echo "QUESTING_ROOTFS=$HOME/questing-rootfs/ubuntu-questing-aarch64" >> "$GITHUB_ENV"

      - name: JVM unit tests (D15 shell-integration + MK model-catalog suites)
        # Advisor follow-up (2026-10-15, CI hygiene): the --tests filter used to
        # execute only a few suites while the rest merely COMPILED — a green badge
        # proved nothing about their assertions. Now the FULL unit-test task runs
        # every suite, and the verification step below fails the build if any
        # required suite did not execute (missing or zero tests).
        working-directory: android
        run: ./gradlew testProdDebugUnitTest --stacktrace

      - name: Verify every suite executed (per-suite counts; missing/zero = FAIL)
        working-directory: android
        run: python3 ci-test-report.py

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: codespace-ide-arm64-v8a
          path: android/app/build/outputs/apk/**/app-prod-arm64-v8a-debug.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: codespace-ide-armeabi-v7a
          path: android/app/build/outputs/apk/**/app-prod-armeabi-v7a-debug.apk
          if-no-files-found: warn

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: codespace-ide-x86_64
          path: android/app/build/outputs/apk/**/app-prod-x86_64-debug.apk
          if-no-files-found: warn
